name: Update Google reviews

# Keeps data/reviews.json in step with the clinic's Google Business Profile.
# Runs daily and can also be triggered by hand from the Actions tab.
#
# Until the GBP_* secrets are configured (see docs/reviews-setup.md) the job
# skips itself rather than failing, so it does not send a failure email every
# morning. Once the secrets exist, any genuine problem does fail loudly.

on:
  schedule:
    - cron: "30 1 * * *" # ~07:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether Google credentials are configured
        id: check
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
        run: |
          if [ -n "$GBP_CLIENT_ID" ] && [ -n "$GBP_CLIENT_SECRET" ] && [ -n "$GBP_REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Google reviews sync skipped"
              echo ""
              echo "The \`GBP_CLIENT_ID\`, \`GBP_CLIENT_SECRET\` and \`GBP_REFRESH_TOKEN\`"
              echo "secrets are not set, so there is nothing to sync against."
              echo ""
              echo "The reviews already committed in \`data/reviews.json\` are still"
              echo "being served — the website is unaffected."
              echo ""
              echo "Setup instructions: \`docs/reviews-setup.md\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.configured == 'true'
        with:
          python-version: "3.12"

      - name: Fetch latest reviews
        if: steps.check.outputs.configured == 'true'
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_LOCATION_NAME: ${{ secrets.GBP_LOCATION_NAME }}
          REVIEWS_MAX: "15"
          REVIEWS_MIN_STARS: "4"
        run: python3 tools/fetch_reviews.py

      - name: Commit if the reviews changed
        if: steps.check.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data/reviews.json; then
            echo "No change in reviews." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git commit -m "Sync Google reviews"
          git push
          echo "Published updated reviews." >> "$GITHUB_STEP_SUMMARY"
